name = "zsd-app"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "D1_DB"
database_name = "zsd-db"
database_id = "your-database-id-here"   # 替换为实际数据库 ID

# ============================================================
# 数据库迁移（按 tag 顺序执行）
# ============================================================

# v1: 添加版本字段、索引，并创建所有基础表
[[migrations]]
tag = "v1"
sql = """
-- 用户表
CREATE TABLE IF NOT EXISTS users (
    id TEXT PRIMARY KEY,
    name TEXT UNIQUE NOT NULL,
    unit TEXT NOT NULL,
    pwd TEXT NOT NULL,
    warmup_score INTEGER DEFAULT 0,
    rank_score INTEGER DEFAULT 0,
    challenge_score INTEGER DEFAULT 0,
    total_score INTEGER DEFAULT 0,
    today_warmup_score INTEGER DEFAULT 0,
    today_rank_score INTEGER DEFAULT 0,
    today_challenge_score INTEGER DEFAULT 0,
    daily_score INTEGER DEFAULT 0,
    daily_score_date TEXT DEFAULT '',
    warmup_date TEXT DEFAULT '',
    challenge_date TEXT DEFAULT '',
    challenge_used INTEGER DEFAULT 0,
    version INTEGER DEFAULT 1,
    reward_date TEXT DEFAULT '',
    created_at TEXT DEFAULT '',
    updated_at TEXT DEFAULT ''
);
CREATE INDEX IF NOT EXISTS idx_users_name ON users(name);

-- 排位每日记录
CREATE TABLE IF NOT EXISTS rank_daily (
    user_id TEXT NOT NULL,
    date TEXT NOT NULL,
    used INTEGER DEFAULT 0,
    PRIMARY KEY (user_id, date)
);
CREATE INDEX IF NOT EXISTS idx_rank_daily_user_date ON rank_daily(user_id, date);

-- 每日积分历史（用于周/月榜）
CREATE TABLE IF NOT EXISTS daily_score_history (
    user_id TEXT NOT NULL,
    date TEXT NOT NULL,
    daily_score INTEGER DEFAULT 0,
    PRIMARY KEY (user_id, date)
);

-- 每日各赛制最高分（用于周/月榜）
CREATE TABLE IF NOT EXISTS daily_scores (
    user_id TEXT NOT NULL,
    date TEXT NOT NULL,
    warmup_score INTEGER DEFAULT 0,
    rank_score INTEGER DEFAULT 0,
    challenge_score INTEGER DEFAULT 0,
    PRIMARY KEY (user_id, date)
);

-- 答题历史（可选）
CREATE TABLE IF NOT EXISTS quiz_history (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    user_id TEXT NOT NULL,
    quiz_date TEXT NOT NULL,
    mode TEXT NOT NULL,
    score INTEGER DEFAULT 0
);
CREATE INDEX IF NOT EXISTS idx_quiz_history_user_mode ON quiz_history(user_id, mode);
"""

# v2: reward_date 字段已在 v1 中创建，此处占位避免重复执行错误
[[migrations]]
tag = "v2"
sql = "SELECT 1;"

# v3: daily_scores 已在 v1 中创建，此处占位
[[migrations]]
tag = "v3"
sql = "SELECT 1;"

# v4: 创建题库表
[[migrations]]
tag = "v4"
sql = """
CREATE TABLE IF NOT EXISTS questions (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    mode TEXT NOT NULL,
    question TEXT NOT NULL,
    option_a TEXT NOT NULL,
    option_b TEXT NOT NULL,
    option_c TEXT NOT NULL,
    option_d TEXT NOT NULL,
    correct TEXT NOT NULL CHECK (correct IN ('A','B','C','D')),
    sort_order INTEGER DEFAULT 0,
    created_at DATETIME DEFAULT CURRENT_TIMESTAMP
);
CREATE INDEX IF NOT EXISTS idx_questions_mode ON questions(mode);
"""